name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-output.txt
          $testExitCode = $LASTEXITCODE
          '### Test output' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          '```text' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Get-Content -LiteralPath test-output.txt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($testExitCode -ne 0) { exit $testExitCode }
