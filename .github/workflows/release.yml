name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install -e . pyinstaller
      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name DownloadReceipt --paths src src/download_receipt/__main__.py
      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/DownloadReceipt.exe -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed." }
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path dist/DownloadReceipt.exe -DestinationPath dist/DownloadReceipt-windows-x64.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/DownloadReceipt-windows-x64.zip
